name: project2
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3
  get_storage: ^2.1.1
  http: ^1.6.0
  flutter_spinkit: ^5.2.2
  intl: ^0.20.2
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  permission_handler: ^12.0.3
  dotted_border: ^3.1.0
  image_picker: ^1.2.2
  camera: ^0.12.0+1
  #tflite: ^1.1.2 todo try this for gpu
  tflite_v2: ^1.0.0
  dropdown_search: ^7.0.0
  otp_text_field: ^1.1.3
  timer_count_down: ^2.2.2
  image: ^4.9.1
  path_provider: ^2.1.5
  processing_camera_image: ^0.0.12


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  win32: ^5.5.4


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/paper_model2.tflite
    - assets/paper_model2.txt

  fonts:
    - family: arabic
